name: bodegas-del-atuel

services:
  db:
    build:
      context: ./db
      # Contexto adicional: el Dockerfile copia consultas/ a /opt/bodegas/consultas.
      additional_contexts:
        consultas: ./consultas
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:?Defina POSTGRES_BOOTSTRAP_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Defina POSTGRES_BOOTSTRAP_PASSWORD en .env}
      DB_OWNER_USER: ${DB_OWNER_USER:?Defina DB_OWNER_USER en .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Defina DB_OWNER_PASSWORD en .env}
      DB_APP_USER: ${DB_APP_USER:?Defina DB_APP_USER en .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD en .env}
      DB_REPORT_USER: ${DB_REPORT_USER:?Defina DB_REPORT_USER en .env}
      DB_REPORT_PASSWORD: ${DB_REPORT_PASSWORD:?Defina DB_REPORT_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Tarea única: aplica las migraciones como propietario y termina. Usa la
  # misma imagen de db (mismo build, capas en caché) y sólo recibe las
  # credenciales del propietario, nunca las de bootstrap ni las de la API.
  migrate:
    build:
      context: ./db
      # Contexto adicional: el Dockerfile copia consultas/ a /opt/bodegas/consultas.
      additional_contexts:
        consultas: ./consultas
    entrypoint: ["/opt/bodegas/db/migrate.sh"]
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      DB_OWNER_USER: ${DB_OWNER_USER:?Defina DB_OWNER_USER en .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Defina DB_OWNER_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - datos
    restart: "no"

  # Carga masiva (Etapa 3). Perfil "seed": no corre con un `up` normal.
  # Uso: docker compose --profile seed run --rm seed
  # Sólo recibe las credenciales del propietario y sólo está en la red datos.
  seed:
    build:
      context: ./db/seed
    profiles: ["seed"]
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      DB_OWNER_USER: ${DB_OWNER_USER:?Defina DB_OWNER_USER en .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Defina DB_OWNER_PASSWORD en .env}
      SEMILLA: ${SEMILLA:-20260427}
      FECHA_REFERENCIA: ${FECHA_REFERENCIA:-2026-10-27}
      ESCALA: ${ESCALA:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - datos
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      DB_USER: ${DB_APP_USER:?Defina DB_APP_USER en .env}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD en .env}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-2}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - datos
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Pruebas automáticas de la API. Perfil "test": no corre con un `up` normal.
  # Uso: docker compose --profile test run --rm api-test
  # Misma configuración y rol que la API (nunca el propietario); sólo red datos.
  api-test:
    build:
      context: ./api
      target: test
    profiles: ["test"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      DB_USER: ${DB_APP_USER:?Defina DB_APP_USER en .env}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD en .env}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-2}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}
      # Swagger se prueba directo contra la API y a través de nginx.
      API_URL: http://api:8000
      FRONT_URL: http://front
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    networks:
      - datos
      - web
    restart: "no"

  # Pruebas de punta a punta del front (Etapa 7). Perfil "test": no corre con un
  # `up` normal; se usa con front/tests/ejecutar.sh, que levanta un proyecto
  # aislado y cargado. El navegador (Chromium de Playwright) corre DENTRO de la
  # red, abre http://front y llama a /api por el mismo origen, a través de nginx,
  # como en producción. Las verificaciones en la base usan el rol de REPORTES
  # (sólo lectura): ni el propietario ni la cuenta de inicialización. Las
  # escrituras de las pruebas pasan siempre por el front y la API.
  front-test:
    build:
      context: ./front/tests
    profiles: ["test"]
    environment:
      FRONT_URL: http://front
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      DB_USER: ${DB_REPORT_USER:?Defina DB_REPORT_USER en .env}
      DB_PASSWORD: ${DB_REPORT_PASSWORD:?Defina DB_REPORT_PASSWORD en .env}
    volumes:
      # El código del front, en sólo lectura, para la prueba estática de "sin cálculos".
      - ./front:/front:ro
      # Capturas de las pruebas que fallan (no se versiona).
      - ./front/tests/salida:/tests/salida
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      front:
        condition: service_healthy
    networks:
      - datos
      - web
    restart: "no"

  front:
    build:
      context: ./front
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONT_PORT:-8080}:80"
    networks:
      - web
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1/healthz || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  datos:
    internal: true
  web:
