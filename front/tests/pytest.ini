[pytest]
testpaths = .
# -rP muestra lo que imprimen las pruebas que pasan (los conteos de la venta sin
# stock van para el informe). La captura de pantalla ante una falla se guarda en
# salida/resultados, una subcarpeta del volumen: pytest-playwright vacía su
# directorio de salida al empezar y no puede vaciar el punto de montaje mismo.
addopts = -rP -p no:cacheprovider --screenshot only-on-failure --output salida/resultados
