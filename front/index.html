<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Gestión de vinos, ventas, transferencias y reportes de Bodegas del Atuel"
    >
    <title>Bodegas del Atuel</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/config.js"></script>
  </head>
  <body>
    <header class="encabezado-aplicacion">
      <a class="marca" href="#/vinos" aria-label="Ir al catálogo de Bodegas del Atuel">
        <span class="marca__etiqueta">Trabajo Práctico Integrador</span>
        <span class="marca__nombre">Bodegas del Atuel</span>
      </a>

      <section class="salud" aria-label="Estado del sistema">
        <div
          id="estado"
          class="estado estado--comprobando"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          aria-busy="true"
        >
          <span class="estado__indicador" aria-hidden="true"></span>
          <span class="estado__contenido">
            <strong id="estado-texto">Comprobando conexión…</strong>
            <span id="estado-detalle">Consultando PostgreSQL.</span>
            <span class="estado__hora">
              Última comprobación:
              <time id="hora-comprobacion">pendiente</time>
            </span>
          </span>
        </div>
        <button id="reintentar" class="boton boton--secundario boton--compacto" type="button">
          Reintentar
        </button>
      </section>
    </header>

    <nav class="navegacion" aria-label="Secciones principales">
      <div class="navegacion__interior">
        <a href="#/vinos" data-ruta="/vinos">Catálogo</a>
        <a href="#/vinos/nuevo" data-ruta="/vinos/nuevo">Nuevo vino</a>
        <a href="#/venta" data-ruta="/venta">Nueva venta</a>
        <a href="#/transferencias" data-ruta="/transferencias">Transferencias</a>
        <a href="#/tablero" data-ruta="/tablero">Tablero</a>
      </div>
    </nav>

    <main id="vista" class="contenedor" tabindex="-1"></main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
