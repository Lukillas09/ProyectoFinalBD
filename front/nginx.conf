server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # DNS interno de Docker. Con el nombre en una variable, nginx lo resuelve
    # en cada pedido (con caché de 10 s) y no una sola vez al arrancar: si el
    # contenedor api se recrea con otra IP, el proxy la encuentra sin reiniciar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        # Con una variable, proxy_pass no reemplaza el prefijo: se quita /api a
        # mano. La query string se conserva.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Prefijo público: la API lo usa para que Swagger (/api/docs) pida
        # /api/openapi.json y "Try it out" llame a /api/... (app/main.py).
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
